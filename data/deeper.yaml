# Deeper layer: sourced findings beyond the main Wikipedia table. See data/README.md.
Be:
  - text: The Greek word beryllos named various blue-green stones and came from Prakrit veruḷiya or veḷuriya, "beryl". The Sanskrit vaiḍūrya is considered a later Sanskritization of it, not its source.
    certainty: attested
    sources:
      - "en.wikipedia: Beryl @ 1381494172"
  - text: Ultimately of Dravidian origin, maybe after Belur or Velur, a town in southern India.
    certainty: disputed
    sources:
      - "en.wikipedia: Beryl @ 1381494172"
      - "en.wiktionary: beryl @ 93837312"
Na:
  - text: Soda came through Italian from an Arabic name of salt-tolerant plants (suwaydāʾ, the seablite genus Suaeda). Their ashes gave soda ash, which was also made from saltworts.
    certainty: traditional
    sources:
      - "en.wiktionary: soda @ 94572399"
      - "en.wikipedia: Sodium carbonate @ 1380705515"
  - text: Another explanation derives it from Arabic suda, "headache", as soda was a remedy for it.
    certainty: disputed
    sources:
      - "en.wikipedia: Sodium @ 1380092162"
  - text: The symbol comes from natrium, named after natron, the salt the ancient Egyptians mined for burial rites, Egyptian nṯrj. It passed through Greek nitron, so nitrogen has the same root.
    certainty: attested
    sources:
      - "en.wikipedia: Natron @ 1375081479"
      - "en.wiktionary: natron @ 93709328"
Mg:
  - text: Magnesia was named after the Magnetes, an ancient Greek tribe mentioned in the Iliad. Their colonies in Anatolia bore the same name.
    certainty: attested
    sources:
      - "en.wikipedia: Magnesia (regional unit) @ 1380367985"
      - "en.wikipedia: Magnetes @ 1370757526"
  - text: The word magnet has the same origin, "stone of Magnesia". The sources differ on whether that means the Greek region or its colony in today's Turkey.
    certainty: attested
    sources:
      - "en.wikipedia: Magnesia (regional unit) @ 1380367985"
      - "en.wiktionary: magnet @ 93751114"
Sc:
  - text: The Latin name goes back to Proto-Germanic *Skadinawjō. According to some scholars it combines *skaðan-, "danger", with *awjō, "island", referring to the treacherous sandbanks around Scania.
    certainty: disputed
    sources:
      - "en.wikipedia: Scandinavia @ 1381424511"
      - "en.wiktionary: Scandinavia @ 92922100"
  - text: Alternatively it may be related to *skaðwa-, "shadow", and to the name of the Norse goddess Skaði.
    certainty: disputed
    sources:
      - "en.wikipedia: Scandinavia @ 1381424511"
Mn:
  - text: In antiquity two black minerals from the lands of the Magnetes were both called magnes. The "male" one attracted iron and gave us the word magnet. The "female" one did not, and it was later called magnesia, from which manganese developed.
    certainty: attested
    sources:
      - "en.wikipedia: Manganese @ 1382944860"
      - "en.wiktionary: manganese @ 92354640"
Fe:
  - text: Old English īsern goes back to Proto-Germanic *īsarną, borrowed from Proto-Celtic *īsarnom, possibly related to a word for "blood". The Wikipedia table gives "holy or strong metal" instead.
    certainty: disputed
    sources:
      - "en.wiktionary: iron @ 94559727"
  - text: Latin ferrum is of unknown source, perhaps a loan from a pre-Latin language. One proposal connects it to Phoenician barzel, "iron".
    certainty: disputed
    sources:
      - "en.wiktionary: ferrum @ 93595291"
Cu:
  - text: Copper comes from Latin aes Cyprium, "Cyprian metal", after the Greek name of Cyprus, a major source of copper in the Bronze Age. The word Kypriot is attested in Mycenaean Greek of the 15th century BC.
    certainty: attested
    sources:
      - "en.wiktionary: copper @ 94551081"
      - "en.wikipedia: Cyprus @ 1381867303"
  - text: The origin of the name Cyprus itself is unknown. Proposals include an Eteocypriot word for copper, perhaps related to Sumerian zubar (copper) or kubar (bronze), the Greek name of the henna tree, and a Semitic goddess.
    certainty: disputed
    sources:
      - "en.wikipedia: Cyprus @ 1381867303"
      - "en.wiktionary: copper @ 94551081"
As:
  - text: From Syriac zarnika and Persian zarnikh, based on zar, "gold", hence the golden yellow mineral orpiment.
    certainty: attested
    sources:
      - "en.wikipedia: Arsenic @ 1382246719"
      - "en.wiktionary: arsenic @ 94546632"
  - text: The Greek arsenikon, "male, virile", which the Wikipedia table gives as its meaning, is a folk etymology which reshaped the foreign word.
    certainty: attested
    sources:
      - "en.wikipedia: Arsenic @ 1382246719"
Sr:
  - text: The Gaelic name of the village, Sròn an t-Sìthein, means "nose (that is, point) of the fairy hill", a low round hill inhabited by the mythological sídhe.
    certainty: attested
    sources:
      - "en.wikipedia: Strontian @ 1365492688"
Y:
  - text: The Swedish name of the village literally means "outer village". Its quarry gave names to four elements, yttrium, terbium, erbium and ytterbium.
    certainty: attested
    sources:
      - "en.wikipedia: Ytterby @ 1380007014"
Ru:
  - text: Rus' is generally considered a borrowing from Finnic Ruotsi, "Sweden", from Old Norse róðr, "rowing, fleet levy", as in róþsmenn, "rowers". An older form in Proto-Norse is reconstructed.
    certainty: traditional
    sources:
      - "en.wikipedia: Rus' people @ 1368860158"
  - text: A compatible theory leads through Rōþin, an older name of the Swedish coast of Roslagen, which itself comes from the same word.
    certainty: disputed
    sources:
      - "en.wikipedia: Rus' people @ 1368860158"
Gd:
  - text: A vicar, Jakob Gadolin (1678–1758), took the surname after his father's farm Magnula, rendering it with Hebrew gadol, "great", like Latin magnus. Johan Gadolin was his grandson.
    certainty: attested
    sources:
      - "sv.wikipedia: Gadolin @ 59502114"
      - "fi.wikipedia: Johan Gadolin @ 23889706"
W:
  - text: Swedish tung sten means "heavy stone" and first named the mineral scheelite.
    certainty: attested
    sources:
      - "en.wiktionary: tungsten @ 93605346"
  - text: Wolfram is generally explained as German Wolf and Rahm, "wolf's cream or soot", a translation of Latin lupi spuma, "wolf's froth", a term of contempt because the ore disturbed the smelting of tin. It may also come from a personal name.
    certainty: disputed
    sources:
      - "en.wiktionary: wolfram @ 93837932"
Au:
  - text: Old English gold goes back to Proto-Germanic *gulþą and to a Proto-Indo-European root for "green, yellow". The word yellow is related.
    certainty: traditional
    sources:
      - "en.wiktionary: gold @ 94509769"
  - text: Latin aurum goes back to a Proto-Indo-European root meaning "to dawn, become light, become red".
    certainty: traditional
    sources:
      - "en.wiktionary: aurum @ 94589779"
Lu:
  - text: Most likely from a Celtic root lut-, "swamp, marsh", which survives in Scottish Gaelic lòn, "pool, meadow". Greek authors recorded the settlement as Loukotokía and Leukotekía.
    certainty: traditional
    sources:
      - "en.wikipedia: Lutetia @ 1370197365"
  - text: A less likely origin is a Celtic word for "mice", perhaps after the shape of the two islands in the Seine.
    certainty: disputed
    sources:
      - "en.wikipedia: Lutetia @ 1370197365"
Fr:
  - text: France comes from Latin Francia, the land of the Franks, whose rule gave it the name.
    certainty: attested
    sources:
      - "en.wikipedia: Name of France @ 1357000742"
      - "en.wiktionary: France @ 94539397"
  - text: The meaning of the name of the Franks is not certain. Proposals are "javelin" and "fierce". The word frank, "free", most likely comes from the name of the Franks, who were the free ruling class, not the other way round.
    certainty: disputed
    sources:
      - "en.wikipedia: Franks @ 1381483252"
      - "en.wikipedia: Name of France @ 1357000742"
Am:
  - text: America comes from Americus, the Latin form of the name of Amerigo Vespucci, used on the map by Martin Waldseemüller in 1507. Other explanations have been suggested, such as the Amerrisque Mountains or Richard Amerike.
    certainty: traditional
    sources:
      - "en.wikipedia: Naming of the Americas @ 1358654761"
  - text: Amerigo is an old Italian form of Medieval Latin Emericus, from Old High German Emmerich. That may have merged several Germanic names, one of them Haimirich, "home ruler", related to Henry. Wikipedia flags this explanation as needing a better source.
    certainty: disputed
    sources:
      - "en.wikipedia: Naming of the Americas @ 1358654761"
Bk:
  - text: The element is named after the city, itself named after the philosopher George Berkeley. His surname is an English place name, first recorded in 824 as Berclea, from Old English beorc, "birch", and lēah, "meadow, clearing".
    certainty: attested
    sources:
      - "en.wikipedia: Berkeley, California @ 1379437650"
      - "en.wikipedia: Berkeley, Gloucestershire @ 1341843754"
      - "en.wiktionary: Berkeley @ 92512554"
      - "en.wiktionary: lea @ 93704503"
Es:
  - text: Literally "ein Stein" is German for "one stone", but the surname has several proposed origins. It may come from places named after Middle High German einsteinen, "to enclose with stone", or be an ornamental name ending in -stein.
    certainty: disputed
    sources:
      - "en.wikipedia: Einstein (surname) @ 1371411957"
      - "en.wikipedia: Einstein family @ 1379540415"
Sg:
  - text: Seaborg is the English form of the Swedish surname Sjöberg, from sjö, "lake", and berg, "mountain".
    certainty: traditional
    sources:
      - "en.wiktionary: Seaborg @ 92514171"
      - "en.wiktionary: sjö @ 93816231"
      - "en.wiktionary: berg @ 93467322"
Mc:
  - text: Moscow takes its name from the Moskva River. The most widely accepted theory derives it from a Proto-Balto-Slavic root related to "wet", so it might mean a river at a wetland. Wiktionary gives Proto-Slavic *mosky, "swamp, dampness".
    certainty: traditional
    sources:
      - "en.wikipedia: Moscow @ 1383089166"
      - "en.wiktionary: Moscow @ 94541781"
  - text: A Finno-Ugric hypothesis derives it from Mustajoki, "black river".
    certainty: disputed
    sources:
      - "en.wikipedia: Moscow @ 1383089166"
Og:
  - text: Oganessian is the Russified form of the Armenian surname Hovhannisyan, from the given name Hovhannes, the equivalent of John. John goes back to Hebrew Yôḥānān, "God has been gracious".
    certainty: attested
    sources:
      - "en.wikipedia: Yuri Oganessian @ 1377348860"
      - "en.wikipedia: Hovhannes @ 1290855289"
      - "en.wikipedia: John (given name) @ 1381822284"
Li:
  - text: "Berzelius chose Greek lithos, \"stone\", because this alkali was found in a solid mineral, while potassium came from plant ashes and sodium was known from animal blood."
    certainty: attested
    sources:
      - "en.wikipedia: Lithium @ 1381202909"
B:
  - text: "Borax came to English through Anglo-Norman and Medieval Latin from Arabic bawraq, which goes back to Middle Persian. Boron takes its stem, with the ending of carbon."
    certainty: attested
    sources:
      - "en.wiktionary: borax @ 94548479"
      - "en.wiktionary: boron @ 94581531"
C:
  - text: "Antoine Lavoisier coined French carbone from Latin carbō, \"charcoal\". Its further origin is uncertain, possibly a root for \"heat, fire\" also seen in the English hearth."
    certainty: traditional
    sources:
      - "en.wiktionary: carbon @ 94549356"
      - "en.wiktionary: carbo @ 92354337"
N:
  - text: "Greek nitron, \"niter\", goes back to Egyptian nṯrj, the same word as natron, which gave sodium its symbol. The ending means \"to bring forth\": nitrogen makes niter."
    certainty: attested
    sources:
      - "en.wiktionary: natron @ 93709328"
      - "en.wikipedia: Natron @ 1375081479"
      - "en.wikipedia: List of chemical element name etymologies @ 1382331679"
O:
  - text: "Lavoisier's French oxygène was first principe oxygène, the \"acidifying principle\", from Greek for \"sharp\" and \"birth\". It rests on the mistaken belief that oxygen is essential to all acids."
    certainty: attested
    sources:
      - "en.wiktionary: oxygen @ 94565932"
      - "en.wikipedia: List of chemical element name etymologies @ 1382331679"
Al:
  - text: "Latin alūmen literally meant something like \"bitter (salt)\" and is related to the English word ale."
    certainty: traditional
    sources:
      - "en.wiktionary: alumen @ 93811870"
S:
  - text: "Latin sulpur is of uncertain origin, and spellings with ph and f came from the false belief that it was Greek. The Wikipedia table derives it from a root for \"to burn\", while Wiktionary calls it unknown, perhaps related to a Germanic word for sulfur."
    certainty: disputed
    sources:
      - "en.wikipedia: Sulfur @ 1383017237"
      - "en.wiktionary: sulpur @ 82342347"
      - "en.wikipedia: List of chemical element name etymologies @ 1382331679"
K:
  - text: "Potash comes from pot and ash, as the substance was leached from ashes and boiled down in a pot. Potassium was formed from its Latin version, potassa."
    certainty: attested
    sources:
      - "en.wiktionary: potash @ 93475546"
      - "en.wikipedia: List of chemical element name etymologies @ 1382331679"
Ca:
  - text: "Latin calx, \"limestone\", was either borrowed from Greek khálix, \"pebble\", or both languages took it from an older unknown one."
    certainty: disputed
    sources:
      - "en.wiktionary: calx @ 94533950"
Co:
  - text: "German Kobold, \"goblin\": silver miners in the Harz used the word for rock laced with arsenic and sulfur, which spoiled the ore and made them ill."
    certainty: attested
    sources:
      - "en.wiktionary: cobalt @ 94550333"
      - "en.wikipedia: Cobalt @ 1381994421"
Ni:
  - text: "Not \"copper-colored ore\", as the Wikipedia table has it. German miners called the ore Kupfernickel, \"copper goblin\", blaming a mischievous sprite as they could get no copper from it. Cronstedt shortened the name in 1751."
    certainty: attested
    sources:
      - "en.wikipedia: Nickel @ 1380101141"
      - "en.wiktionary: nickel @ 93774532"
Zn:
  - text: "Probably named by Paracelsus after German Zinke, \"prong, tooth\", which goes back to Old High German zinko and is related to the English tine."
    certainty: traditional
    sources:
      - "en.wikipedia: Zinc @ 1382708274"
      - "en.wiktionary: zinc @ 94578472"
Zr:
  - text: "Zircon comes through German and Arabic from Middle Persian. Persian zargun means \"gold-like\", from zar, \"gold\", the same word as in arsenic."
    certainty: attested
    sources:
      - "en.wiktionary: zircon @ 93116968"
      - "en.wikipedia: Zirconium @ 1382708454"
Ag:
  - text: "Old English seolfor has relatives across Germanic, Baltic, Slavic and Celtic, and also in Basque and Berber, but its ultimate origin is unknown. The Wikipedia table proposes a loan from Akkadian ṣarpu, \"refined silver\"."
    certainty: disputed
    sources:
      - "en.wiktionary: silver @ 93722479"
      - "en.wikipedia: List of chemical element name etymologies @ 1382331679"
Cd:
  - text: "Latin cadmia, Greek kadmeia, was calamine, a cadmium-bearing mix of minerals, named after Cadmus, the mythical founder of Thebes."
    certainty: attested
    sources:
      - "en.wikipedia: Cadmium @ 1381637428"
      - "en.wiktionary: cadmium @ 93572417"
In:
  - text: "Named after the indigo line in its spectrum. Indigo comes through Latin from Greek indikon, \"from India\"."
    certainty: attested
    sources:
      - "en.wiktionary: indigo @ 93631957"
      - "en.wikipedia: List of chemical element name etymologies @ 1382331679"
  - text: "India is named after the Indus River. Sanskrit sindhu means \"river, stream\", and especially the Indus. The Old Persian Hinduš was used for the lower Indus basin and passed into Greek as Indos. Wiktionary derives India from the Sanskrit, but elsewhere treats the Old Persian and Sanskrit forms as relatives from an older word of uncertain origin."
    certainty: traditional
    sources:
      - "en.wikipedia: Names of India @ 1382512174"
      - "en.wiktionary: India @ 94540371"
      - "en.wiktionary: सिन्धु @ 93636077"
      - "en.wiktionary: Ἰνδός @ 92779634"
Sn:
  - text: "Old English tin goes back to a Proto-Germanic word without a known origin."
    certainty: attested
    sources:
      - "en.wiktionary: tin @ 93797088"
  - text: "Latin stannum, the source of the symbol, is of Celtic origin."
    certainty: traditional
    sources:
      - "en.wiktionary: stannum @ 91209611"
Sb:
  - text: "The name antimony comes from Medieval Latin antimonium, attested in the 11th century, and its origin is uncertain. The popular story of a \"monk-killer\" is a folk etymology, and several authorities suspect a scribal corruption of an Arabic word."
    certainty: disputed
    sources:
      - "en.wikipedia: Antimony @ 1381623857"
      - "en.wiktionary: antimony @ 94546216"
  - text: "Latin stibium comes from Greek stibi, a variant of stimmi. The Egyptians called antimony mśdmt or stm."
    certainty: attested
    sources:
      - "en.wiktionary: stibium @ 92387105"
      - "en.wikipedia: Antimony @ 1381623857"
Te:
  - text: "Klaproth coined the name in 1798 from Latin tellūs, \"earth\", and that word's further origin is uncertain."
    certainty: attested
    sources:
      - "en.wiktionary: tellurium @ 93863208"
      - "en.wiktionary: tellus @ 91783585"
Pb:
  - text: "Old English lēad goes back to Proto-Germanic *lauda-, possibly borrowed from Celtic. Latin plumbum may be related, through a lost language of Europe."
    certainty: disputed
    sources:
      - "en.wikipedia: Lead @ 1382398829"
      - "en.wiktionary: lead @ 94560651"
      - "en.wiktionary: plumbum @ 92694404"
Bi:
  - text: "The origin of bismuth is uncertain. It may come from German weiße Masse or Wismuth, \"white mass\", which Georgius Agricola rendered in Latin as bisemutum."
    certainty: disputed
    sources:
      - "en.wikipedia: Bismuth @ 1382453045"
      - "en.wiktionary: bismuth @ 92214111"
Rn:
  - text: "A contraction of radium emanation, the gas given off in the decay of radium, with the -on of the noble gases."
    certainty: attested
    sources:
      - "en.wiktionary: radon @ 94637933"
Ac:
  - text: "From Greek aktis, \"beam, ray\", in the same way as the second part of protactinium."
    certainty: attested
    sources:
      - "en.wiktionary: actinium @ 93039810"
      - "en.wikipedia: List of chemical element name etymologies @ 1382331679"
Ga:
  - text: "Latin Gallia was the land of the Gauls, whose name is generally derived from a Celtic root for \"power, ability\". The discoverer, Lecoq de Boisbaudran, named it after France. Allegations that he also named it after himself, as Latin gallus is French le coq, \"rooster\", he denied."
    certainty: traditional
    sources:
      - "en.wikipedia: Gauls @ 1382897180"
      - "en.wiktionary: Gallia @ 93132893"
      - "en.wikipedia: List of chemical element name etymologies @ 1382331679"
Ge:
  - text: "Germania means \"land of the Germani\", but the origin of that name is unknown. Even its language is disputed, with proposals of Germanic, Celtic, Latin and Illyrian."
    certainty: attested
    sources:
      - "en.wikipedia: Germania @ 1348712649"
      - "en.wikipedia: Germanic peoples @ 1382484845"
Tb:
  - text: "One of four elements named after the quarry at this Swedish village, with yttrium, erbium and ytterbium."
    certainty: attested
    sources:
      - "en.wikipedia: Ytterby @ 1380007014"
Ho:
  - text: "Holmia is the Latin form of Stockholm, first recorded in 1252. Swedish stock means \"log\" and holm \"islet\". The logs may have kept out ships, and stock may also come from an old German word for \"fortification\"."
    certainty: traditional
    sources:
      - "en.wikipedia: Stockholm @ 1382901523"
      - "en.wiktionary: Stockholm @ 94595200"
Er:
  - text: "One of four elements named after the quarry at this Swedish village, with yttrium, terbium and ytterbium."
    certainty: attested
    sources:
      - "en.wikipedia: Ytterby @ 1380007014"
Tm:
  - text: "First written of by the Greek explorer Pytheas about 320 BC, Thule was the far north of the ancient maps, later identified with Iceland, Norway, Scandinavia and others. Isidore of Seville connected the name to the sun."
    certainty: traditional
    sources:
      - "en.wikipedia: Thule @ 1379930143"
      - "en.wiktionary: Thule @ 93452135"
Yb:
  - text: "One of four elements named after the quarry at this Swedish village, with yttrium, terbium and erbium."
    certainty: attested
    sources:
      - "en.wikipedia: Ytterby @ 1380007014"
Hf:
  - text: "Hafnia is the Latin name of Copenhagen, from Old Norse hǫfn, \"harbor\". Copenhagen itself is Køpmannæhafn, \"merchants' harbor\", the same words as English \"chapmen's haven\"."
    certainty: attested
    sources:
      - "en.wiktionary: Hafnia @ 92503570"
      - "en.wikipedia: Copenhagen @ 1382526252"
      - "en.wiktionary: Copenhagen @ 94538487"
Re:
  - text: "Latin Rhenus comes from Gaulish Rēnos, a river name built on a root meaning \"to flow, run\". Latin rivus, \"river\", is related."
    certainty: traditional
    sources:
      - "en.wiktionary: Rhine @ 94578904"
      - "en.wikipedia: Rhine @ 1381219422"
Po:
  - text: "Polonium honors the homeland of Marie Curie. Poland is named after the Polans, a West Slavic tribe, and that likely comes from pole, \"field\", so \"field dwellers\"."
    certainty: traditional
    sources:
      - "en.wikipedia: Names of Poland @ 1351068420"
      - "en.wikipedia: Polans (western) @ 1379340462"
      - "en.wiktionary: Poland @ 94542643"
      - "en.wikipedia: List of chemical element name etymologies @ 1382331679"
Cf:
  - text: "Most historians trace California to a Spanish novel of around 1510, Las sergas de Esplandián, with a fictional island ruled by Queen Calafia. Explorers took the peninsula for such an island. Her name may be a play on Arabic for \"caliph\"."
    certainty: traditional
    sources:
      - "en.wikipedia: Etymology of California @ 1371981416"
      - "en.wikipedia: California @ 1382283994"
      - "en.wiktionary: California @ 94535285"
Hs:
  - text: "Latin Hassia means Hesse, and the name goes back to its people, the Hessians, often traced to the Chatti. There is no clear agreement on what the name Chatti meant."
    certainty: disputed
    sources:
      - "en.wikipedia: Hesse @ 1382834846"
      - "en.wikipedia: Chatti @ 1378958311"
Ds:
  - text: "First recorded in the late 11th century as Darmundestat. Its origin is uncertain, with current research seeing a man's name Darmund, others a settlement at a guarded gateway."
    certainty: disputed
    sources:
      - "de.wikipedia: Darmstadt @ 271747793"
      - "en.wikipedia: Darmstadt @ 1382713422"
Nh:
  - text: "Nihon is written 日本, \"sun\" and \"origin\", which is why Japan is known as the land of the rising sun."
    certainty: attested
    sources:
      - "en.wiktionary: 日本 @ 93472794"
      - "en.wikipedia: Names of Japan @ 1377999714"
Lv:
  - text: "Named after Lawrence Livermore National Laboratory in the city of Livermore, itself named after the English-born rancher Robert Livermore. The surname is probably from the English place Livermere in Suffolk. Great Livermere's name is explained as \"reed lake\", from Old English lēfer, \"rush, reed\", and mere, \"pond, pool, lake\"."
    certainty: traditional
    sources:
      - "en.wikipedia: Great Livermere @ 1375437244"
      - "en.wiktionary: Livermere @ 92245903"
      - "en.wikipedia: Livermore, California @ 1380986623"
      - "en.wikipedia: Robert Livermore @ 1351503432"
      - "en.wiktionary: Livermore @ 92187690"
Ts:
  - text: "Tennessee comes from Tanasi, a Cherokee town on what is now the Little Tennessee River. The name is believed to mean \"winding river\"."
    certainty: traditional
    sources:
      - "en.wikipedia: Tennessee @ 1380707474"
      - "en.wiktionary: Tennessee @ 94544030"
Eu:
  - text: "Europa was a Phoenician princess in Greek myth. One view takes her name from Greek eurús, \"wide\", and ōps, \"eye, face\", so \"wide-gazing\" or \"broad of aspect\". A Semitic word for \"west\" has been proposed, but is considered unlikely."
    certainty: disputed
    sources:
      - "en.wikipedia: Europe @ 1383018724"
Sm:
  - text: "Named after the mineral samarskite, itself after the mining engineer Vasili Samarsky-Bykhovets (1803–1870). He was the first person whose name was given to an element."
    certainty: attested
    sources:
      - "en.wikipedia: Samarskite-(Y) @ 1280069939"
      - "en.wikipedia: Vassili Samarsky-Bykhovets @ 1348507086"
Md:
  - text: "The surname is young: as was usual for priests' children of the time, Mendeleev's father received it at the theological seminary, after a local landlord."
    certainty: attested
    sources:
      - "en.wikipedia: Dmitri Mendeleev @ 1381816376"
No:
  - text: "The family came from the village of Östra Nöbbelöv in Scania, and its first member wrote himself Petrus Olai Nobelius. The village was written Nybbile in 1322, a name containing nyböle, \"new settlement\"."
    certainty: attested
    sources:
      - "en.wikipedia: Nobel family @ 1381461231"
      - "sv.wikipedia: Östra Nöbbelöv @ 48902495"
      - "sv.wikipedia: Nöbbelöv, Lund @ 59148402"
Lr:
  - text: "Lawrence comes from the Roman martyr Laurentius, \"a person from Laurentum\", a place name possibly derived from Latin laurus, \"laurel\"."
    certainty: traditional
    sources:
      - "en.wiktionary: Laurence @ 92514358"
      - "en.wikipedia: Lawrence (given name) @ 1381206182"
Rf:
  - text: "The surname comes from a place in the Scottish Borders, from Old English hryþer, \"cattle\", and ford. The clan's own legends tell of a man called Ruther who guided a king across the Tweed."
    certainty: traditional
    sources:
      - "en.wiktionary: Rutherford @ 94543096"
      - "en.wikipedia: Rutherford (name) @ 1379921902"
      - "en.wikipedia: Clan Rutherford @ 1378524892"
Bh:
  - text: "The Danish surname comes from German Baar or Bahr, and has been recorded in Denmark since the 18th century."
    certainty: traditional
    sources:
      - "en.wiktionary: Bohr @ 92245328"
Cn:
  - text: "Copernicus is the Latin form of Kopernik, a surname given to people from the Silesian village of Koperniki. The village name has been tied both to Polish koper, \"dill\", and to a German word for \"copper\". His father also traded in copper."
    certainty: disputed
    sources:
      - "en.wikipedia: Nicolaus Copernicus @ 1382794491"
He:
  - text: "Greek hḗlios has relatives in Latin sōl and Sanskrit sū́rya, all from one Proto-Indo-European word for the sun."
    certainty: attested
    sources:
      - "en.wiktionary: ἥλιος @ 92272665"
V:
  - text: "Vanadís is one of the many names of Freyja, under which she searched for her husband. It means a dís, a goddess, of the Vanir, whose own name has many proposed etymologies."
    certainty: traditional
    sources:
      - "en.wikipedia: Freyja @ 1370311846"
      - "en.wikipedia: Vanir @ 1376454612"
Se:
  - text: "Greek selḗnē, the moon and its goddess, comes from selas, \"light, brightness\"."
    certainty: attested
    sources:
      - "en.wikipedia: Selene @ 1375351131"
      - "en.wiktionary: Selene @ 93596965"
Pd:
  - text: "Named after the asteroid Pallas, itself after an epithet of Athena. It either comes from pallō, \"to brandish\", or, more likely, from pallakis and related words for \"youth, young woman\"."
    certainty: disputed
    sources:
      - "en.wikipedia: Athena @ 1383157461"
      - "en.wiktionary: Pallas @ 92177160"
Ce:
  - text: "Named after the asteroid Ceres, itself after the Roman goddess of grain. Her name goes back to a root meaning \"to grow\" or \"to feed\", and it became a word for grain and bread."
    certainty: traditional
    sources:
      - "en.wiktionary: Ceres @ 94530632"
      - "en.wikipedia: Ceres (mythology) @ 1382036521"
Pm:
  - text: "The usual view takes Prometheus as \"forethought\", with his brother Epimetheus as \"afterthought\", but the etymology is debated."
    certainty: disputed
    sources:
      - "en.wikipedia: Prometheus @ 1381775303"
      - "en.wiktionary: Prometheus @ 90485347"
Ta:
  - text: "Tantalus has been read as \"who has to bear much\", from Greek tálas, \"wretched\", while a medieval source gives \"wishing for a vision\". His punishment also gave English tantalize."
    certainty: disputed
    sources:
      - "en.wikipedia: Tantalus @ 1378549502"
Th:
  - text: "Old Norse Þórr comes from a Proto-Germanic name related to Old English þunor, and probably to a Proto-Indo-European root for \"thunder\". The English word thunder is related."
    certainty: traditional
    sources:
      - "en.wikipedia: Thor @ 1368276040"
      - "en.wiktionary: Thor @ 94544062"
U:
  - text: "Named after the planet, itself after the Greek god of the sky. Most linguists connect Ouranos to a root for \"to rain, moisten\"."
    certainty: traditional
    sources:
      - "en.wikipedia: Uranus (mythology) @ 1381772217"
      - "en.wiktionary: Uranus @ 94475473"
      - "en.wikipedia: List of chemical element name etymologies @ 1382331679"
Np:
  - text: "Named after the planet, itself after the Roman god. The etymology of Neptunus is unclear, with proposals of a root for \"cloud, sky\" and of a \"descendant of water\"."
    certainty: disputed
    sources:
      - "en.wikipedia: Neptune (mythology) @ 1380183577"
      - "en.wiktionary: Neptune @ 93751555"
Pu:
  - text: "Named after Pluto, then counted as the next planet after Neptune, as neptunium follows uranium. Greek Ploutōn was the ruler of the underworld, often conflated with Ploutos, the god of wealth, because mineral wealth lies underground."
    certainty: traditional
    sources:
      - "en.wikipedia: Pluto (god) @ 1381045388"
      - "en.wiktionary: Pluto @ 93952956"
      - "en.wikipedia: List of chemical element name etymologies @ 1382331679"
Ir:
  - text: "Greek iris means \"rainbow\" and was also the goddess who personified it, the messenger of the gods. The name refers to the bright colors of the salts."
    certainty: attested
    sources:
      - "en.wikipedia: Iris (mythology) @ 1380530218"
      - "en.wiktionary: iridium @ 93131758"
Hg:
  - text: "Mercurius may come from Latin merx, \"merchandise\", as in merchant, or from Etruscan. Medieval alchemy paired the seven known metals with the Sun, the Moon and the planets, and quicksilver with Mercury, perhaps also because a liquid metal suits the swift god."
    certainty: disputed
    sources:
      - "en.wiktionary: Mercurius @ 92969477"
      - "en.wikipedia: Mercury (mythology) @ 1381676266"
      - "en.wiktionary: mercury @ 92753415"
Cm:
  - text: "The surname came through Pierre Curie. Wiktionary reads it as a reduced form of Old French escuerie, \"stable\", the word behind modern écurie, so it would first have named a stable hand."
    certainty: traditional
    sources:
      - "en.wiktionary: Curie @ 92512663"
      - "en.wiktionary: écurie @ 91320998"
Fm:
  - text: "Wiktionary takes Fermi as a patronymic surname, from the Italian personal name Fermo."
    certainty: traditional
    sources:
      - "en.wiktionary: Fermi @ 92512736"
Mt:
  - text: "According to Wiktionary, a great-great-grandfather of Lise Meitner took the surname Meietheiner in the late 18th century, meaning someone from Meiethein. That is the Moravian village now called Majetín, and the name later shortened to Meitheiner, Meithner and Meitner."
    certainty: traditional
    sources:
      - "en.wiktionary: Meitner @ 92416755"
      - "en.wikipedia: Majetín @ 1379561479"
Db:
  - text: "Wiktionary derives the Russian name Dubna from an Old East Slavic adjective, dubĭnŭ (дубьнъ), used as a noun. It is formed from dubŭ (дубъ), \"oak\". The town lies where the Dubna River joins the Volga. The Slavic word for oak has no cognates outside the branch, and its deeper origin is uncertain."
    certainty: traditional
    sources:
      - "en.wiktionary: Дубна @ 92531286"
      - "en.wiktionary: Reconstruction:Proto-Slavic/dǫbъ @ 92531290"
      - "en.wikipedia: Dubna @ 1375802660"
Tc:
  - text: "Greek tekhnētos (τεχνητός), \"artificial\", is built on tékhnē (τέχνη), \"art, skill, craft\", the word behind technology as well. The name was chosen in 1947 because technetium was the first element to be produced artificially."
    certainty: attested
    sources:
      - "en.wiktionary: τεχνητός @ 92069569"
      - "en.wikipedia: Techne @ 1263040232"
      - "en.wikipedia: Technetium @ 1379384632"
